name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: firmware

jobs:
  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      # The simulator links against X11, even when it runs headless.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Unit tests
        run: pio test -e test
      - name: End-to-end tests
        run: uv run --with-requirements e2e/requirements.txt pytest e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-failures
          path: firmware/e2e/failure_*.png
          if-no-files-found: ignore

  firmware:
    name: Board firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-board-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      - run: pio run
      # The build is reproducible, so this matches a local build of the same commit.
      - run: (cd .pio/build/rp2350_touch_lcd_2 && sha256sum firmware.uf2) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: firmware/.pio/build/rp2350_touch_lcd_2/firmware.uf2

  web:
    name: Browser simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.10
      - run: pio pkg install -e sim && make -C web -j"$(nproc)"
