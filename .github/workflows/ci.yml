name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: firmware

jobs:
  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      # The simulator links against X11, even when it runs headless.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Unit tests
        run: pio test -e test
      - name: End-to-end tests
        run: uv run --with-requirements e2e/requirements.txt pytest e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failures
          path: firmware/e2e/failure_*.png
          if-no-files-found: ignore

  firmware:
    name: Board firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-board-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      - run: pio run
      # The build is reproducible, so this matches a local build of the same commit.
      - run: (cd .pio/build/rp2350_touch_lcd_2 && sha256sum firmware.uf2) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware/.pio/build/rp2350_touch_lcd_2/firmware.uf2

  web:
    name: Browser simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.10
      - run: pio pkg install -e sim && make -C web -j"$(nproc)"
