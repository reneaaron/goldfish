name: Companion release

# Builds Dove (companion/) for a release tag (dove-v0.1.0) and publishes it as
# a GitHub release: the .deb, the AppImage, SHA256SUMS and a build provenance
# attestation for each, so anyone can check a file came from this workflow at
# this tag:
#   gh attestation verify Dove_0.1.0_amd64.AppImage --repo reneaaron/goldfish \
#     --signer-workflow reneaaron/goldfish/.github/workflows/companion-release.yml --source-ref refs/tags/dove-v0.1.0
# Unlike the firmware, these builds aren't reproducible.
#
# Goldfish's own releases are the v* tags (release.yml). A Dove release is
# never marked "latest": Dove's firmware update and the website both take the
# latest release as Goldfish's.

on:
  push:
    tags: ['dove-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04   # the oldest glibc the AppImage then runs on
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write
    defaults:
      run:
        working-directory: companion/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version matches the tag
        run: |
          want=${GITHUB_REF_NAME#dove-v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tauri=$(jq -r .version tauri.conf.json)
          if [ "$cargo" != "$want" ] || [ "$tauri" != "$want" ]; then
            echo "Cargo.toml says '$cargo', tauri.conf.json '$tauri', tag wants '$want'"; exit 1
          fi
      # Tauri on Linux needs WebKitGTK; the camera's V4L2 bindings need libclang;
      # the AppImage step runs linuxdeploy, which needs FUSE or file.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libclang-dev libfuse2 file
      # No cache: nothing an earlier run left goes into a release.
      - run: cargo test --locked
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - name: Fetch the AppImage tools, checked against appimage-tools.sha256
        run: |
          dir=~/.cache/tauri && mkdir -p "$dir"
          while read -r sum name url; do
            curl -fsSL -o "$dir/$name" "$url"
            echo "$sum  $dir/$name" | sha256sum -c
            chmod +x "$dir/$name"
          done < <(grep -v '^#' ../appimage-tools.sha256)
      - run: cargo tauri build --ci -- --locked
      - name: Check Tauri fetched no tool beyond the checked ones
        run: |
          # The two .sh plugins are embedded in tauri-bundler, not downloaded.
          for f in ~/.cache/tauri/*; do
            n=$(basename "$f")
            case "$n" in linuxdeploy-plugin-gtk.sh|linuxdeploy-plugin-gstreamer.sh) continue ;; esac
            grep -q "  $n  " ../appimage-tools.sha256 || { echo "Not in appimage-tools.sha256: $n"; exit 1; }
          done
      - name: Collect files
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          (cd dist && sha256sum * > SHA256SUMS)
          tee -a "$GITHUB_STEP_SUMMARY" < dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            companion/src-tauri/dist/*.deb
            companion/src-tauri/dist/*.AppImage
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#dove-v}
          cat > dist/notes.md <<EOF
          Dove $version, the watch-only wallet app for Goldfish. Linux (x86-64) only. Not for real funds.

          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`

          Check a file before running it:

          \`\`\`bash
          gh attestation verify <file> --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/companion-release.yml --source-ref $GITHUB_REF
          \`\`\`
          EOF
          # Draft first, then publish: an immutable release can't take assets once published.
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.AppImage dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false \
            --title "Dove $version" --notes-file dist/notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
