name: Web flasher

# Builds the board firmware from main and publishes it with flasher/index.html
# on GitHub Pages (Settings > Pages > Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths: [firmware/**, flasher/**, .github/workflows/flasher.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-board-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv tool install platformio==6.1.19
      - run: pio run
        working-directory: firmware
      - name: Assemble site
        run: |
          mkdir site
          cp flasher/index.html site/
          cp firmware/.pio/build/rp2350_touch_lcd_2/firmware.uf2 site/
          echo '{"commit":"${{ github.sha }}"}' > site/firmware.json
          # The page shows this same hash, computed in the browser.
          (cd site && sha256sum firmware.uf2) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
