name: Release

# Builds the board firmware for a release tag (v0.1.0) and publishes it as a
# GitHub release: firmware.uf2, SHA256SUMS and a build provenance attestation,
# so anyone can check the file came from this workflow at this tag:
#   gh attestation verify firmware.uf2 --repo reneaaron/goldfish \
#     --signer-workflow reneaaron/goldfish/.github/workflows/release.yml --source-ref refs/tags/v0.1.0
# The build is reproducible, so a local build of the tag gives the same hash.
# The Website workflow runs after this one and offers the release's file.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv tool install platformio==6.1.19
      # No cache: nothing an earlier run left in ~/.platformio goes into a release.
      # PlatformIO checks no hash for packages it downloads by URL, so fetch those
      # here, check them against toolchain.sha256, and put them where PlatformIO
      # looks first (its download cache, keyed by sha1 of the URL): it installs
      # these exact bytes instead of downloading again.
      - name: Fetch the toolchain, checked against toolchain.sha256
        run: |
          dl=~/.platformio/.cache/downloads && mkdir -p "$dl"
          while read -r sum url; do
            file="$dl/$(printf %s "$url" | sha1sum | cut -c1-40)"
            curl -fsSL -o "$file" "$url"
            echo "$sum  $file" | sha256sum -c
          done < <(grep -v '^#' toolchain.sha256)
      - run: pio run
      - name: Check every package fetched by URL was one checked above
        run: |
          for f in ~/.platformio/packages/*/.piopm; do
            url=$(jq -r '.spec.uri // empty' "$f")
            case "$url" in http*.git*|"") continue ;; esac
            grep -q "  $url\$" toolchain.sha256 || { echo "Not in toolchain.sha256: $url"; exit 1; }
          done
      - name: Check the version the firmware shows
        run: |
          shown=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' include/version.h)
          if [ "$shown" != "$GITHUB_REF_NAME" ]; then
            echo "Firmware shows '$shown', expected '$GITHUB_REF_NAME'"; exit 1
          fi
      - name: Collect files
        run: |
          mkdir -p dist
          cp .pio/build/rp2350_touch_lcd_2/firmware.uf2 dist/
          (cd dist && sha256sum firmware.uf2 > SHA256SUMS)
          tee -a "$GITHUB_STEP_SUMMARY" < dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: firmware/dist/firmware.uf2
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(cut -d' ' -f1 dist/SHA256SUMS)
          cat > dist/notes.md <<EOF
          SHA-256 of \`firmware.uf2\`: \`$hash\`

          Check it before flashing, either way:

          \`\`\`bash
          gh attestation verify firmware.uf2 --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF
          \`\`\`

          \`\`\`bash
          git checkout $GITHUB_REF_NAME && cd firmware && pio run && sha256sum .pio/build/rp2350_touch_lcd_2/firmware.uf2
          \`\`\`
          EOF
          # Draft first, then publish: an immutable release can't take assets once published.
          gh release create "$GITHUB_REF_NAME" dist/firmware.uf2 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
