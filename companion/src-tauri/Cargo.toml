[package]
name = "goldfish-companion"
version = "0.1.0"
edition = "2021"
default-run = "goldfish-companion"
publish = false

[lib]
name = "companion"
path = "src/lib.rs"

[[bin]]
name = "goldfish-companion"
path = "src/main.rs"

# The e2e tests' stand-in for the window; behind a feature so the release
# bundles don't ship it.
[[bin]]
name = "companion-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
cli = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdk_wallet = "3.2"
bdk_esplora = { version = "0.22", default-features = false, features = ["std", "blocking-https-rustls"] }
ur = "0.5"
qrcode = { version = "0.15", default-features = false, features = ["std", "svg"] }
rqrr = { version = "0.11", default-features = false }
v4l = "0.14"
base64 = "0.22"
bdk_electrum = "0.24"
tauri-plugin-opener = "2.7"
age = { version = "0.11", default-features = false }
minreq = { version = "2.14", features = ["https-rustls", "proxy"] }
tauri-plugin-dialog = "2.8"

[dev-dependencies]
bdk_wallet = { version = "3.2", features = ["keys-bip39"] }

# Unoptimized, the password's scrypt makes a dev build slow to unlock.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
