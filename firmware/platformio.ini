; RP2350 stateless signer firmware
; Board: Waveshare RP2350-Touch-LCD-2 (RP2350A, 16MB flash, 2" 240x320 + CST816D touch)
; Shared UI and logic live in src/app; src/board is the hardware, src/sim the desktop simulator.

[platformio]
default_envs = rp2350_touch_lcd_2

[common]
lib_deps =
    lvgl/lvgl@9.2.2
    https://github.com/micro-bitcoin/uBitcoin.git#877542fdc16319dd92a7d2a679ea9dacce474bd2

[env:rp2350_touch_lcd_2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_src_filter = +<app/> +<board/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps = ${common.lib_deps}

[env:sim]
platform = native
build_src_filter = +<app/> +<sim/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DSIM_X11
    -DUSE_STDONLY
    -Iinclude
    -lX11
lib_deps = ${common.lib_deps}

[env:test]
platform = native
test_build_src = yes
build_src_filter = +<app/amount.cpp> +<app/seedqr.cpp> +<app/seed_create.cpp> +<app/wallet.cpp> +<app/ur.cpp> +<app/psbt_review.cpp> +<app/address_verify.cpp>
build_flags =
    -DUSE_STDONLY
    -Iinclude
lib_deps = https://github.com/micro-bitcoin/uBitcoin.git#877542fdc16319dd92a7d2a679ea9dacce474bd2
