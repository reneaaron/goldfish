; RP2350 stateless signer firmware
; Board: Waveshare RP2350-Touch-LCD-2 (RP2350A, 16MB flash, 2" 240x320 + CST816D touch)
; Shared UI and logic live in src/app; src/board is the hardware, src/sim the desktop simulator.

[platformio]
default_envs = rp2350_touch_lcd_2

[common]
; libwally-core 1.6.1, pinned by commit. PlatformIO only fetches it (lib_ignore);
; lib/wally builds it from its amalgamation. Bitcoin only, no Elements.
wally =
    https://github.com/ElementsProject/libwally-core.git#f7b0a15b8d6fc79a5c4ed0123955dd482934483e
    symlink://lib/wally
lib_deps =
    lvgl/lvgl@9.2.2
    ${common.wally}
lib_ignore = libwally-core
build_flags = -DWALLY_ABI_NO_ELEMENTS

[env:rp2350_touch_lcd_2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_upload.maximum_size = 16777216
build_src_filter = +<app/> +<board/>
build_flags =
    ${common.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -DPIO_FRAMEWORK_ARDUINO_NO_USB   ; no USB stack: the running device is not a USB device
    -Iinclude
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}

[env:sim]
platform = native
build_src_filter = +<app/> +<sim/>
build_flags =
    ${common.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -DSIM_X11
    -Iinclude
    -lX11
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}

[env:test]
platform = native
test_build_src = yes
build_src_filter = +<app/amount.cpp> +<app/qrscan.cpp> +<app/seedqr.cpp> +<app/seed_create.cpp> +<app/bip39_english.cpp> +<app/wallet.cpp> +<app/ur.cpp> +<app/psbt_review.cpp> +<app/address_verify.cpp> +<app/bip85.cpp> +<app/multisig.cpp>
build_flags =
    ${common.build_flags}
    -Iinclude
lib_deps = ${common.wally}
lib_ignore = ${common.lib_ignore}
