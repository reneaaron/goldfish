<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <style>
      .cap{font-family:Inter,Helvetica,Arial,sans-serif;font-size:16px;fill:#5b554c;text-anchor:middle}
      .name{font-family:Georgia,'DejaVu Serif',serif;font-size:26px;font-weight:bold;fill:#1c1a17}
    </style>
    <clipPath id="t"><rect width="128" height="128" rx="30"/></clipPath>
    <!-- colours come from CSS variables so one drawing serves every colourway -->
    <g id="icon">
      <g clip-path="url(#t)">
        <rect width="128" height="128" style="fill:var(--tile)"/>
        <g transform="translate(4,10)">
          <path d="M24,72 Q12,70 11,58" fill="none" style="stroke:var(--body)" stroke-width="8" stroke-linecap="round"/>
          <path d="M11,58 C2,56 0,44 7,38 C12,34 20,38 18,46 C16,52 14,55 11,58Z" style="fill:var(--body)"/>
          <path d="M9,50 C6,44 8,36 16,35 C13,39 12,44 9,50Z" style="fill:var(--dark)"/>
          <path d="M36,52 Q32,40 30,30" fill="none" style="stroke:var(--body)" stroke-width="8" stroke-linecap="round"/>
          <path d="M52,52 Q56,40 58,30" fill="none" style="stroke:var(--body)" stroke-width="8" stroke-linecap="round"/>
          <rect x="60" y="62" width="56" height="14" rx="4" style="fill:var(--body)"/>
          <path d="M70,69 H108" style="stroke:var(--dark)" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="88" y="72" width="9" height="14" rx="2.5" style="fill:var(--body)"/>
          <rect x="102" y="72" width="11" height="20" rx="2.5" style="fill:var(--body)"/>
          <ellipse cx="44" cy="70" rx="27" ry="23" style="fill:var(--body)"/>
          <ellipse cx="35" cy="60" rx="9" ry="4.5" style="fill:var(--hi)"/>
          <path d="M35,76 Q44,84 53,76" fill="none" style="stroke:var(--mouth)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="30" cy="26" r="12.5" style="fill:var(--eye);stroke:var(--ring)" stroke-width="2.5"/><circle cx="33.5" cy="27" r="6.5" fill="#1c1a17"/><circle cx="36" cy="24.5" r="2.2" fill="#fff"/>
          <circle cx="58" cy="26" r="12.5" style="fill:var(--eye);stroke:var(--ring)" stroke-width="2.5"/><circle cx="61.5" cy="27" r="6.5" fill="#1c1a17"/><circle cx="64" cy="24.5" r="2.2" fill="#fff"/>
        </g>
      </g>
    </g>
  </defs>

  <rect width="900" height="470" fill="#f1ebe0"/>
  <text x="40" y="56" class="name">Hermitkey icon, refined</text>

  <!-- colourways -->
  <g transform="translate(60,96)" style="--tile:#1c1a17;--body:#d9772e;--dark:#b85c1c;--hi:#e8955a;--mouth:#1c1a17;--eye:#fff;--ring:none"><use href="#icon"/></g>
  <g transform="translate(270,96)" style="--tile:#f5dcc6;--body:#d9772e;--dark:#b85c1c;--hi:#e8955a;--mouth:#1c1a17;--eye:#fff;--ring:#1c1a17"><use href="#icon"/></g>
  <g transform="translate(480,96)" style="--tile:#d9772e;--body:#1c1a17;--dark:#d9772e;--hi:#3a3630;--mouth:#d9772e;--eye:#fff;--ring:none"><use href="#icon"/></g>
  <g transform="translate(690,96)" style="--tile:#f1ebe0;--body:#1c1a17;--dark:#f1ebe0;--hi:#3a3630;--mouth:#f1ebe0;--eye:#fff;--ring:#1c1a17"><rect x="-1" y="-1" width="130" height="130" rx="31" fill="none" stroke="#d8cfbf"/><use href="#icon"/></g>
  <text x="124" y="252" class="cap">Dark (main)</text>
  <text x="334" y="252" class="cap">Peach</text>
  <text x="544" y="252" class="cap">Orange tile</text>
  <text x="754" y="252" class="cap">Mono, for print</text>

  <!-- size test on the main colourway -->
  <g style="--tile:#1c1a17;--body:#d9772e;--dark:#b85c1c;--hi:#e8955a;--mouth:#1c1a17;--eye:#fff;--ring:none">
    <g transform="translate(60,300) scale(.5)"><use href="#icon"/></g>
    <g transform="translate(150,316) scale(.25)"><use href="#icon"/></g>
    <g transform="translate(206,324) scale(.125)"><use href="#icon"/></g>
  </g>
  <text x="140" y="400" class="cap">64 · 32 · 16 px</text>

  <!-- on the boot screen style background -->
  <g transform="translate(480,290)">
    <rect width="320" height="100" rx="14" fill="#fbf8f2" stroke="#e2d9c8"/>
    <g transform="translate(18,18) scale(.5)" style="--tile:#1c1a17;--body:#d9772e;--dark:#b85c1c;--hi:#e8955a;--mouth:#1c1a17;--eye:#fff;--ring:none"><use href="#icon"/></g>
    <text x="96" y="58" style="font-family:Georgia,'DejaVu Serif',serif;font-size:32px;font-weight:bold;fill:#1c1a17">Hermitkey</text>
  </g>
  <text x="640" y="420" class="cap">With the wordmark</text>
</svg>
