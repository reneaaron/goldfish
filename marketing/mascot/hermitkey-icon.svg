<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hermitkey icon: a key whose bow is the hermit crab -->
  <defs><clipPath id="t"><rect width="128" height="128" rx="30"/></clipPath></defs>
  <g clip-path="url(#t)">
    <rect width="128" height="128" fill="#1c1a17"/>
    <g transform="translate(4,10)">
      <!-- raised claw -->
      <path d="M24,72 Q12,70 11,58" fill="none" stroke="#d9772e" stroke-width="8" stroke-linecap="round"/>
      <path d="M11,58 C2,56 0,44 7,38 C12,34 20,38 18,46 C16,52 14,55 11,58Z" fill="#d9772e"/>
      <path d="M9,50 C6,44 8,36 16,35 C13,39 12,44 9,50Z" fill="#b85c1c"/>
      <!-- eye stalks -->
      <path d="M36,52 Q32,40 30,30" fill="none" stroke="#d9772e" stroke-width="8" stroke-linecap="round"/>
      <path d="M52,52 Q56,40 58,30" fill="none" stroke="#d9772e" stroke-width="8" stroke-linecap="round"/>
      <!-- blade -->
      <rect x="60" y="62" width="56" height="14" rx="4" fill="#d9772e"/>
      <path d="M70,69 H108" stroke="#b85c1c" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="88" y="72" width="9" height="14" rx="2.5" fill="#d9772e"/>
      <rect x="102" y="72" width="11" height="20" rx="2.5" fill="#d9772e"/>
      <!-- bow = body -->
      <ellipse cx="44" cy="70" rx="27" ry="23" fill="#d9772e"/>
      <ellipse cx="35" cy="60" rx="9" ry="4.5" fill="#e8955a"/>
      <path d="M35,76 Q44,84 53,76" fill="none" stroke="#1c1a17" stroke-width="3.5" stroke-linecap="round"/>
      <!-- eyes, glancing toward the blade -->
      <circle cx="30" cy="26" r="12.5" fill="#fff"/><circle cx="33.5" cy="27" r="6.5" fill="#1c1a17"/><circle cx="36" cy="24.5" r="2.2" fill="#fff"/>
      <circle cx="58" cy="26" r="12.5" fill="#fff"/><circle cx="61.5" cy="27" r="6.5" fill="#1c1a17"/><circle cx="64" cy="24.5" r="2.2" fill="#fff"/>
    </g>
  </g>
</svg>
