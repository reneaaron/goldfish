<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <style>
      .ink{fill:#1c1a17}.screen{fill:#f6f1e7}.shell{fill:#d9772e}.shellDk{fill:#b85c1c}.peach{fill:#f5dcc6}
      .stalk{fill:none;stroke:#d9772e;stroke-width:7;stroke-linecap:round}
      .cap{font-family:Inter,Helvetica,Arial,sans-serif;font-size:17px;fill:#5b554c;text-anchor:middle}
      .name{font-family:Georgia,'DejaVu Serif',serif;font-size:22px;font-weight:bold;fill:#1c1a17;text-anchor:middle}
    </style>
    <clipPath id="tile"><rect width="128" height="128" rx="30"/></clipPath>

    <g id="eye">
      <circle r="12" fill="#fff" stroke="#1c1a17" stroke-width="3"/>
      <circle cx="2" cy="1.5" r="6" class="ink"/>
      <circle cx="4.5" cy="-1.5" r="2" fill="#fff"/>
    </g>
    <g id="claw">
      <path class="shell" d="M0,0 C-4,-16 -30,-20 -38,-4 C-42,8 -28,16 -10,12 C-4,10 -1,6 0,0Z"/>
      <path class="shellDk" d="M-6,-6 C-12,-22 -36,-28 -42,-16 C-34,-17 -20,-14 -6,-6Z"/>
    </g>

    <!-- A: Peek. Whole device, the key peeking out of it -->
    <g id="iconA">
      <g clip-path="url(#tile)">
        <rect width="128" height="128" class="peach"/>
        <path class="stalk" d="M52,40 Q48,28 46,22"/><path class="stalk" d="M76,40 Q80,28 82,22"/>
        <use href="#eye" x="46" y="20"/><use href="#eye" x="82" y="20"/>
        <path class="stalk" style="stroke-width:8" d="M40,92 Q28,96 24,88"/><path class="stalk" style="stroke-width:8" d="M88,92 Q100,96 104,88"/>
        <use href="#claw" transform="translate(25,86) rotate(30) scale(.6)"/>
        <use href="#claw" transform="translate(103,86) scale(-1,1) rotate(30) scale(.6)"/>
        <rect x="36" y="36" width="56" height="76" rx="10" class="ink"/>
        <rect x="42" y="42" width="44" height="58" rx="3" class="screen"/>
        <g class="ink">
          <rect x="46" y="46" width="12" height="12"/><rect x="49" y="49" width="6" height="6" class="screen"/>
          <rect x="70" y="46" width="12" height="12"/><rect x="73" y="49" width="6" height="6" class="screen"/>
          <rect x="46" y="84" width="12" height="12"/><rect x="49" y="87" width="6" height="6" class="screen"/>
          <rect x="62" y="62" width="5" height="5"/><rect x="70" y="70" width="5" height="5"/><rect x="62" y="78" width="5" height="5"/><rect x="76" y="84" width="6" height="6"/><rect x="50" y="68" width="5" height="5"/>
        </g>
      </g>
    </g>

    <!-- B: Crab face. Just the character, front view -->
    <g id="iconB">
      <g clip-path="url(#tile)">
        <rect width="128" height="128" class="peach"/>
        <path class="stalk" d="M52,62 Q48,44 46,34"/><path class="stalk" d="M76,62 Q80,44 82,34"/>
        <use href="#eye" x="46" y="32"/><use href="#eye" x="82" y="32"/>
        <path class="stalk" style="stroke-width:9" d="M34,82 Q20,80 18,66"/><path class="stalk" style="stroke-width:9" d="M94,82 Q108,80 110,66"/>
        <use href="#claw" transform="translate(18,64) rotate(80) scale(.7)"/>
        <use href="#claw" transform="translate(110,64) scale(-1,1) rotate(80) scale(.7)"/>
        <path d="M30,84 Q30,58 64,58 Q98,58 98,84 Q98,104 64,104 Q30,104 30,84Z" class="shell"/>
        <path d="M54,84 Q64,92 74,84" fill="none" stroke="#1c1a17" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M40,104 L34,118 M52,106 L50,120 M76,106 L78,120 M88,104 L94,118" stroke="#b85c1c" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- C: Crab key. A key whose bow is the crab -->
    <g id="iconC">
      <g clip-path="url(#tile)">
        <rect width="128" height="128" class="ink"/>
        <path class="stalk" d="M34,62 Q30,48 28,40"/><path class="stalk" d="M50,62 Q54,48 56,40"/>
        <use href="#eye" x="28" y="38"/><use href="#eye" x="56" y="38"/>
        <rect x="56" y="70" width="56" height="12" rx="3" class="shell"/>
        <rect x="88" y="80" width="9" height="14" rx="2" class="shell"/>
        <rect x="102" y="80" width="10" height="20" rx="2" class="shell"/>
        <circle cx="42" cy="76" r="24" class="shell"/>
        <path d="M33,80 Q42,88 51,80" fill="none" stroke="#1c1a17" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M26,98 L20,110 M36,100 L34,112 M48,100 L50,112" stroke="#b85c1c" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </defs>

  <rect width="900" height="420" fill="#f1ebe0"/>

  <g transform="translate(86,40)"><use href="#iconA"/></g>
  <g transform="translate(386,40)"><use href="#iconB"/></g>
  <g transform="translate(686,40)"><use href="#iconC"/></g>

  <text x="150" y="210" class="name">A · Peek</text>
  <text x="450" y="210" class="name">B · Crab face</text>
  <text x="750" y="210" class="name">C · Hermit key</text>
  <text x="150" y="236" class="cap">key peeking out of the whole device</text>
  <text x="450" y="236" class="cap">just the character, no device</text>
  <text x="750" y="236" class="cap">a key whose bow is the crab</text>

  <!-- small-size test: 48px and 24px -->
  <g transform="translate(96,280) scale(.375)"><use href="#iconA"/></g>
  <g transform="translate(164,292) scale(.1875)"><use href="#iconA"/></g>
  <g transform="translate(396,280) scale(.375)"><use href="#iconB"/></g>
  <g transform="translate(464,292) scale(.1875)"><use href="#iconB"/></g>
  <g transform="translate(696,280) scale(.375)"><use href="#iconC"/></g>
  <g transform="translate(764,292) scale(.1875)"><use href="#iconC"/></g>
  <text x="450" y="370" class="cap">48 px and 24 px</text>
</svg>
