<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 640" width="1240" height="640">
  <defs>
    <!-- Palette taken from the firmware UI (home screen) -->
    <style>
      .bg{fill:#f1ebe0}.ink{fill:#1c1a17}.screen{fill:#f6f1e7}
      .shell{fill:#d9772e}.shellDk{fill:#b85c1c}.belly{fill:#f2b27a}.curl{fill:none;stroke:#d98a4e;stroke-width:4;stroke-linecap:round}
      .leg{fill:none;stroke:#b85c1c;stroke-width:6;stroke-linecap:round}
      .stalk{fill:none;stroke:#d9772e;stroke-width:6;stroke-linecap:round}
      .peach{fill:#f5dcc6}.cap{font-family:Inter,Helvetica,Arial,sans-serif;font-size:19px;fill:#5b554c;text-anchor:middle}
      .title{font-family:Georgia,'DejaVu Serif',serif;font-size:40px;font-weight:bold;fill:#1c1a17}
      .sub{font-family:Inter,Helvetica,Arial,sans-serif;font-size:18px;fill:#5b554c}
    </style>

    <!-- one eye: white, pupil, glint -->
    <g id="eye">
      <circle r="11" fill="#fff" stroke="#1c1a17" stroke-width="2.5"/>
      <circle cx="2" cy="1" r="5.5" class="ink"/>
      <circle cx="4" cy="-1.5" r="1.8" fill="#fff"/>
    </g>

    <!-- pincer pointing left, hinge at origin -->
    <g id="claw">
      <path class="shell" d="M0,0 C-4,-16 -30,-20 -38,-4 C-42,8 -28,16 -10,12 C-4,10 -1,6 0,0Z"/>
      <path class="shellDk" d="M-6,-6 C-12,-22 -36,-28 -42,-16 C-34,-17 -20,-14 -6,-6Z"/>
    </g>

    <!-- the device = the shell (portrait case, 3:4 screen) -->
    <g id="device">
      <rect x="-62" y="-86" width="124" height="172" rx="18" class="ink"/>
      <rect x="-50" y="-74" width="100" height="134" rx="6" class="screen"/>
      <rect x="-14" y="69" width="28" height="5" rx="2.5" fill="#3a3630"/>
    </g>

    <!-- tiny QR on the screen -->
    <g id="qr" class="ink">
      <rect x="-36" y="-56" width="24" height="24"/><rect x="-31" y="-51" width="14" height="14" class="screen"/><rect x="-27" y="-47" width="6" height="6"/>
      <rect x="12" y="-56" width="24" height="24"/><rect x="17" y="-51" width="14" height="14" class="screen"/><rect x="21" y="-47" width="6" height="6"/>
      <rect x="-36" y="12" width="24" height="24"/><rect x="-31" y="17" width="14" height="14" class="screen"/><rect x="-27" y="21" width="6" height="6"/>
      <rect x="-6" y="-56" width="6" height="6"/><rect x="0" y="-44" width="6" height="6"/><rect x="-6" y="-26" width="12" height="6"/>
      <rect x="-36" y="-20" width="6" height="6"/><rect x="-24" y="-8" width="6" height="6"/><rect x="18" y="-20" width="6" height="6"/>
      <rect x="30" y="-8" width="6" height="6"/><rect x="0" y="-8" width="6" height="12"/><rect x="12" y="4" width="12" height="6"/>
      <rect x="-6" y="18" width="6" height="6"/><rect x="6" y="24" width="6" height="6"/><rect x="24" y="18" width="12" height="6"/><rect x="18" y="30" width="6" height="6"/>
    </g>

    <!-- shield icon, as on the home screen -->
    <g id="shield">
      <circle r="28" class="peach"/>
      <path d="M0,-16 L13,-11 L13,0 C13,9 7,14 0,17 C-7,14 -13,9 -13,0 L-13,-11Z" fill="none" stroke="#d9772e" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-6,0 L-1.5,5 L7,-5" fill="none" stroke="#d9772e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- crab at home: parts that stick out from behind the device -->
    <g id="crabBehind">
      <path class="leg" d="M-40,80 Q-56,96 -60,112"/><path class="leg" d="M-24,84 Q-32,100 -32,114"/>
      <path class="leg" d="M40,80 Q56,96 60,112"/><path class="leg" d="M24,84 Q32,100 32,114"/>
      <path class="stalk" d="M-22,-80 Q-28,-100 -30,-112"/><path class="stalk" d="M22,-80 Q28,-100 30,-112"/>
      <use href="#eye" x="-30" y="-118"/><use href="#eye" x="30" y="-118"/>
      <path class="stalk" style="stroke-width:9" d="M-56,48 Q-76,52 -82,40"/>
      <path class="stalk" style="stroke-width:9" d="M56,48 Q76,52 82,40"/>
      <use href="#claw" transform="translate(-82,36) rotate(20)"/>
      <use href="#claw" transform="translate(82,36) scale(-1,1) rotate(20)"/>
    </g>

    <!-- whole crab out of its shell, facing left -->
    <g id="crabFull">
      <path class="leg" d="M-14,14 Q-26,30 -30,44"/><path class="leg" d="M0,18 Q-4,34 -6,46"/><path class="leg" d="M14,16 Q20,32 22,44"/>
      <ellipse cx="40" cy="4" rx="30" ry="24" class="belly"/>
      <path class="curl" d="M40,4 m-12,0 a12,12 0 1,1 12,12 a6,6 0 1,1 -6,-6"/>
      <ellipse cx="0" cy="0" rx="34" ry="22" class="shell"/>
      <ellipse cx="-4" cy="6" rx="22" ry="10" class="shellDk" opacity=".35"/>
      <path class="stalk" d="M-14,-16 Q-20,-34 -22,-46"/><path class="stalk" d="M6,-18 Q8,-36 8,-48"/>
      <use href="#eye" x="-22" y="-52"/><use href="#eye" x="8" y="-54"/>
      <path class="stalk" style="stroke-width:9" d="M-26,8 Q-42,12 -48,4"/>
      <use href="#claw" transform="translate(-48,0) rotate(10)"/>
      <path d="M-24,-2 Q-20,2 -16,-2" fill="none" stroke="#1c1a17" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1240" height="640" class="bg"/>
  <text x="60" y="78" class="title">Hermitkey</text>
  <text x="60" y="110" class="sub">Your key moves in, signs, and moves out. The shell keeps nothing.</text>

  <!-- 1. Unplugged: empty shell -->
  <g transform="translate(180,350)">
    <ellipse cy="122" rx="90" ry="10" fill="#e4dccd"/>
    <use href="#device"/>
    <use href="#shield" y="-10"/>
  </g>
  <text x="180" y="520" class="cap">Unplugged: an empty shell</text>

  <!-- 2. Scan SeedQR: key moves in -->
  <g transform="translate(470,350)">
    <ellipse cy="122" rx="120" ry="10" fill="#e4dccd"/>
    <g transform="translate(40,0)"><use href="#device"/>
      <rect x="-30" y="-40" width="60" height="60" rx="4" fill="none" stroke="#d9772e" stroke-width="3" stroke-dasharray="10 8"/></g>
    <g transform="translate(-78,66) scale(-1.15,1.15)"><use href="#crabFull"/></g>
    <path d="M-36,22 Q-30,-14 -14,-26" fill="none" stroke="#b9ae9c" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  </g>
  <text x="470" y="520" class="cap">Scan your SeedQR: the key moves in</text>

  <!-- 3. Signing: at home -->
  <g transform="translate(770,350)">
    <ellipse cy="122" rx="100" ry="10" fill="#e4dccd"/>
    <use href="#crabBehind"/>
    <use href="#device"/>
    <use href="#qr" y="-6"/>
  </g>
  <text x="770" y="520" class="cap">Signing: the key is at home</text>

  <!-- 4. Unplug: key moves out -->
  <g transform="translate(1040,350)">
    <ellipse cy="122" rx="120" ry="10" fill="#e4dccd"/>
    <g transform="translate(-50,0)"><use href="#device"/><use href="#shield" y="-10"/></g>
    <g transform="translate(78,66) scale(1.15)"><use href="#crabFull" transform="scale(-1,1)"/></g>
    <path d="M22,92 h10 M22,104 h16 M22,80 h6" stroke="#b9ae9c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1040" y="520" class="cap">Unplug: the key walks off</text>

  <!-- app icon / avatar: the key peeking out of its shell -->
  <clipPath id="iconClip"><rect width="128" height="128" rx="30"/></clipPath>
  <g transform="translate(1072,24)">
    <g clip-path="url(#iconClip)">
      <rect width="128" height="128" class="peach"/>
      <g transform="translate(64,126) scale(0.9)"><use href="#crabBehind"/><use href="#device"/></g>
    </g>
  </g>
  <text x="1136" y="176" class="cap" style="font-size:15px">Icon / avatar</text>

  <text x="60" y="600" class="sub">Draft mascot · palette from the firmware UI</text>
</svg>
